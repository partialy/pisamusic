<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>歌词颜色预设</title>
  <script src="../shared/tailwind.js"></script>
  <script src="../shared/tailwind-base.js"></script>
  <script src="colorPicker.js"></script>
  <style>
    :root {
      --bg-flat: #fefefe;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --card-bg: #ffffff;
      --card-border: rgba(226, 232, 240, 0.95);
      --pill-bg: rgba(30, 41, 59, 0.03);
      --pill-border: rgba(100, 116, 139, 0.22);
      --pill-text: #f8fafc;
      --pill-code: rgba(241, 245, 249, 0.95);
      --pill-code-text: #1e293b;
      --danger-bg: #ef4444;
      --danger-fg: #ffffff;
      --danger-border: rgba(255, 255, 255, 0.88);
      --count-bg: rgba(30, 41, 59, 0.06);
      --count-fg: #475569;
      --count-border: rgba(100, 116, 139, 0.2);
      --focus-ring: rgba(56, 189, 248, 0.55);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-flat: #17191d;
        --text-main: #e2e8f0;
        --text-sub: #94a3b8;
        --card-bg: #1e2126;
        --card-border: rgba(148, 163, 184, 0.24);
        --pill-bg: rgba(15, 23, 42, 0.48);
        --pill-border: rgba(148, 163, 184, 0.32);
        --pill-text: #f8fafc;
        --pill-code: rgba(15, 23, 42, 0.70);
        --pill-code-text: #e2e8f0;
        --danger-bg: #ef4444;
        --danger-fg: #ffffff;
        --danger-border: rgba(226, 232, 240, 0.18);
        --count-bg: rgba(148, 163, 184, 0.12);
        --count-fg: #cbd5e1;
        --count-border: rgba(148, 163, 184, 0.25);
        --focus-ring: rgba(56, 189, 248, 0.65);
      }
    }
    .page-bg {
      background: var(--bg-flat);
    }
    .card-cp {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      transition: border-color .35s ease, box-shadow .35s ease;
    }
    .card-cp.focus-highlight {
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 2px var(--focus-ring), 0 8px 20px rgba(15, 23, 42, 0.12);
    }
    .txt-main { color: var(--text-main); }
    .txt-sub { color: var(--text-sub); }
    .count-badge {
      background: var(--count-bg);
      color: var(--count-fg);
      border: 1px solid var(--count-border);
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 52px;
    }
    .color-pill {
      height: 38px;
      width: calc(50% - 4px);
      border-radius: 999px;
      border: 1px solid var(--pill-border);
      background: var(--pill-bg);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 6px 4px 5px;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.14);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .color-pill:active {
      transform: scale(0.97);
    }
    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.12), 0 4px 10px rgba(0, 0, 0, 0.18);
      flex: 0 0 auto;
    }
    .color-code {
      border-radius: 999px;
      padding: 1px 8px;
      background: var(--pill-code);
      color: var(--pill-code-text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      line-height: 20px;
      letter-spacing: 0.4px;
      flex: 1;
      min-width: 0;
      text-align: center;
      user-select: none;
    }
    .del-pill {
      width: 21px;
      height: 21px;
      border-radius: 999px;
      border: 1px solid var(--danger-border);
      background: var(--danger-bg);
      color: var(--danger-fg);
      font-size: 13px;
      font-weight: 700;
      line-height: 19px;
      text-align: center;
      padding: 0;
      flex: 0 0 auto;
    }
  </style>
</head>
<body class="min-h-screen page-bg font-sans antialiased">
  <div class="max-w-md mx-auto px-3 pt-3 pb-24">
    <div id="slots-container"></div>
    <p id="toast" class="hidden text-center text-sm text-amber-800 py-3 px-4 rounded-2xl bg-amber-100 border border-amber-200/80 shadow-sm"></p>
  </div>

  <script>
    var hasScrolledToFocus = false;

    function showToast(msg) {
      var el = document.getElementById('toast');
      if (!msg) { el.classList.add('hidden'); return; }
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(function () { el.classList.add('hidden'); }, 2600);
    }

    function parseResult(jsonStr) {
      try { return JSON.parse(jsonStr); } catch (e) { return { ok: false, message: '数据解析失败' }; }
    }

    function getState() {
      if (typeof AndroidLyricColors === 'undefined') {
        return { maxCount: 12, rowSize: 6, focusSlotKey: '', slots: [] };
      }
      return JSON.parse(AndroidLyricColors.getState());
    }

    function run(action, slotKey, arg1, arg2) {
      if (typeof AndroidLyricColors === 'undefined') return { ok: false, message: '未连接' };
      var s;
      switch (action) {
        case 'addColor': s = AndroidLyricColors.addColor(slotKey, arg1); break;
        case 'removeColor': s = AndroidLyricColors.removeColor(slotKey, arg1); break;
        case 'updateColor': s = AndroidLyricColors.updateColor(slotKey, arg1, arg2); break;
        default: return { ok: false, message: '未知操作' };
      }
      return parseResult(s);
    }

    /** 纯 RGB：仅 #RRGGBB（8 位 #AARRGGBB 时取 RGB） */
    function toRgbHex(colorStr) {
      if (!colorStr) return '#000000';
      colorStr = String(colorStr).trim();
      if (colorStr.indexOf('rgba') === 0 || colorStr.indexOf('rgb') === 0) {
        var m = colorStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
        if (!m) return '#000000';
        return '#' + [+m[1], +m[2], +m[3]].map(function (x) {
          return Math.max(0, Math.min(255, x)).toString(16).padStart(2, '0');
        }).join('').toUpperCase();
      }
      var h = colorStr.replace('#', '');
      if (h.length === 8) h = h.slice(2, 8);
      if (h.length === 6) return '#' + h.toUpperCase();
      return '#000000';
    }

    /** 含 Alpha：#AARRGGBB */
    function toArgbHex(colorStr) {
      if (!colorStr) return '#FFFFFFFF';
      colorStr = String(colorStr).trim();
      if (colorStr.indexOf('rgba') === 0 || colorStr.indexOf('rgb') === 0) {
        var m = colorStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
        if (!m) return '#FFFFFFFF';
        var r = +m[1], g = +m[2], b = +m[3];
        var a = m[4] !== undefined ? Math.round(parseFloat(m[4]) * 255) : 255;
        return '#' + [a, r, g, b].map(function (x) {
          return Math.max(0, Math.min(255, x)).toString(16).padStart(2, '0');
        }).join('').toUpperCase();
      }
      var h = colorStr.replace('#', '');
      if (h.length === 6) return '#FF' + h.toUpperCase();
      if (h.length === 8) return '#' + h.toUpperCase();
      return '#FFFFFFFF';
    }

    /** #AARRGGBB -> CSS rgba(...)，用于与 colorPicker 对齐 */
    function argbHexToCssColor(colorStr) {
      if (!colorStr) return 'rgba(255, 255, 255, 1)';
      var h = String(colorStr).trim().replace('#', '');
      if (h.length === 6) {
        var r6 = parseInt(h.slice(0, 2), 16);
        var g6 = parseInt(h.slice(2, 4), 16);
        var b6 = parseInt(h.slice(4, 6), 16);
        return 'rgba(' + r6 + ', ' + g6 + ', ' + b6 + ', 1)';
      }
      if (h.length === 8) {
        var a = parseInt(h.slice(0, 2), 16) / 255;
        var r = parseInt(h.slice(2, 4), 16);
        var g = parseInt(h.slice(4, 6), 16);
        var b = parseInt(h.slice(6, 8), 16);
        return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + a.toFixed(3) + ')';
      }
      return 'rgba(255, 255, 255, 1)';
    }

    function openColorPicker(allowAlpha, initial, title, onPicked) {
      if (typeof colorPicker === 'undefined') {
        showToast('取色器未加载');
        return;
      }
      if (allowAlpha) {
        colorPicker.show({
          initialColor: argbHexToCssColor(initial),
          title: title || '选择颜色',
          lang: 'zh',
          onSelect: function (c) { onPicked(toArgbHex(c)); },
          onCancel: function () {},
        });
      } else {
        colorPicker.show({
          initialColor: toRgbHex(initial),
          title: title || '选择颜色',
          lang: 'zh',
          onSelect: function (c) { onPicked(toRgbHex(c)); },
          onCancel: function () {},
        });
      }
    }

    function render() {
      var data = getState();
      var container = document.getElementById('slots-container');
      container.innerHTML = '';

      var max = data.maxCount || 12;
      var slots = data.slots || [];
      var focusCardEl = null;

      slots.forEach(function (slot) {
        var colors = slot.colors || [];
        var allowAlpha = !!slot.allowAlpha;

        var section = document.createElement('section');
        section.className = 'card-cp p-4 mb-3';
        section.setAttribute('data-slot-key', slot.slotKey);

        if (!hasScrolledToFocus && data.focusSlotKey && slot.slotKey === data.focusSlotKey) {
          focusCardEl = section;
        }

        var header = document.createElement('div');
        header.className = 'flex justify-between items-start gap-3 mb-4';

        var titleWrap = document.createElement('div');
        var h2 = document.createElement('h2');
        h2.className = 'font-display text-xl font-bold txt-main m-0 tracking-tight';
        h2.textContent = slot.title || '';

        var sub = document.createElement('p');
        sub.className = 'text-[11px] font-bold txt-sub uppercase tracking-widest mt-2';
        sub.textContent = (allowAlpha ? '含 Alpha · 最多 ' : 'RGB · 最多 ') + max + ' 个';

        titleWrap.appendChild(h2);
        titleWrap.appendChild(sub);

        var badge = document.createElement('span');
        badge.className = 'shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full count-badge';
        badge.textContent = colors.length + '/' + max;

        header.appendChild(titleWrap);
        header.appendChild(badge);
        section.appendChild(header);

        var grid = document.createElement('div');
        grid.className = 'pill-row';

        colors.forEach(function (hex, idx) {
          var pill = document.createElement('button');
          pill.type = 'button';
          pill.className = 'color-pill';
          pill.title = '点击修改';
          pill.onclick = function (e) {
            e.stopPropagation();
            openColorPicker(allowAlpha, hex, slot.title, function (out) {
              var r = run('updateColor', slot.slotKey, String(idx), out);
              if (!r.ok) showToast(r.message || '更新失败');
              else showToast('');
              render();
            });
          };

          var dot = document.createElement('span');
          dot.className = 'color-dot';
          dot.style.background = allowAlpha ? argbHexToCssColor(hex) : toRgbHex(hex);

          var code = document.createElement('span');
          code.className = 'color-code';
          code.textContent = allowAlpha ? toArgbHex(hex) : toRgbHex(hex);

          var del = document.createElement('span');
          del.className = 'del-pill';
          del.textContent = '×';
          del.onclick = function (e) {
            e.stopPropagation();
            var r = run('removeColor', slot.slotKey, hex);
            if (!r.ok) showToast(r.message || '无法删除');
            else showToast('');
            render();
          };

          pill.appendChild(dot);
          pill.appendChild(code);
          pill.appendChild(del);
          grid.appendChild(pill);
        });

        section.appendChild(grid);

        var addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'w-full mt-4 py-2.5 rounded-2xl font-display text-sm font-bold cursor-pointer transition-all duration-300 bg-blue-600 text-white border-none hover:translate-y-[-2px] hover:shadow-xl hover:opacity-90 disabled:opacity-40 disabled:hover:translate-y-0 disabled:cursor-not-allowed';
        addBtn.textContent = '添加颜色';
        addBtn.disabled = colors.length >= max;
        addBtn.onclick = function () {
          var initHex = slot.defaultColor || (allowAlpha ? '#FFFFFFFF' : '#BFBFBF');
          openColorPicker(allowAlpha, initHex, '添加' + (slot.title || '颜色'), function (out) {
            var r = run('addColor', slot.slotKey, out);
            if (!r.ok) showToast(r.message || '添加失败');
            else showToast('');
            render();
          });
        };

        section.appendChild(addBtn);
        container.appendChild(section);
      });

      if (focusCardEl) {
        hasScrolledToFocus = true;
        focusCardEl.classList.add('focus-highlight');
        setTimeout(function () {
          focusCardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 60);
        setTimeout(function () {
          focusCardEl.classList.remove('focus-highlight');
        }, 2000);
      }
    }

    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
