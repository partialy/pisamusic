<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PisaMusic 启动</title>
    <link rel="stylesheet" href="../src/startup/startupAnimations.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: #182332;
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
        user-select: none;
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }

      .agreement-card {
        position: relative;
        overflow: hidden;
        width: calc(100vw - 48px);
        height: calc(100vh - 48px);
        display: none;
        flex-direction: column;
        padding: 38px 42px 34px;
        border: 1px solid rgba(255, 255, 255, 0.82);
        border-radius: 28px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(250, 254, 255, 0.92)),
          radial-gradient(circle at 18% 18%, rgba(55, 174, 124, 0.15), transparent 34%),
          radial-gradient(circle at 86% 20%, rgba(40, 151, 255, 0.16), transparent 30%);
        box-shadow: 0 8px 10px rgba(24, 35, 50, 0.12);
        -webkit-app-region: drag;
      }

      .loading-viewport {
        display: none;
        width: 100vw;
        height: 100vh;
        align-items: center;
        justify-content: center;
      }

      body[data-mode="agreement"] .agreement-card {
        display: flex;
      }

      body[data-mode="loading"] .loading-viewport {
        display: flex;
      }

      .agreement-title {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0;
        color: #162032;
      }

      .agreement-subtitle {
        margin: 8px 0 22px;
        color: rgba(24, 35, 50, 0.62);
        font-size: 14px;
      }

      .agreement-content {
        flex: 1;
        padding: 18px 20px;
        border: 1px solid rgba(31, 41, 55, 0.08);
        border-radius: 18px;
        background: rgba(246, 250, 252, 0.92);
        color: rgba(24, 35, 50, 0.78);
        font-size: 14px;
        line-height: 1.85;
        overflow: auto;
        white-space: pre-wrap;
        user-select: text;
        -webkit-app-region: no-drag;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 14px;
        margin-top: 24px;
        -webkit-app-region: no-drag;
      }

      .action-button {
        min-width: 104px;
        height: 42px;
        border: 0;
        border-radius: 999px;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          opacity 0.18s ease;
      }

      .action-button:hover {
        transform: translateY(-1px);
      }

      .action-button:active {
        transform: translateY(0);
        opacity: 0.88;
      }

      .reject-button {
        background: #e24a4a;
        box-shadow: 0 12px 24px rgba(226, 74, 74, 0.24);
      }

      .agree-button {
        background: #20b46b;
        box-shadow: 0 12px 24px rgba(32, 180, 107, 0.24);
      }

      /* 退出确认浮层 */
      .confirm-overlay {
        position: fixed;
        inset: 24px;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        border-radius: 28px;
        background: rgba(246, 250, 252, 0.78);
        backdrop-filter: blur(8px);
        -webkit-app-region: no-drag;
      }

      .confirm-overlay.is-open {
        display: flex;
      }

      .confirm-overlay.is-dark {
        background: rgba(15, 23, 42, 0.72);
      }

      .confirm-overlay.is-cardless {
        inset: 0;
        border-radius: 0;
        background: transparent;
        backdrop-filter: none;
      }

      .confirm-box {
        width: 100%;
        max-width: 310px;
        padding: 22px 24px 20px;
        border: 1px solid rgba(24, 35, 50, 0.08);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 14px 30px rgba(24, 35, 50, 0.14);
        text-align: center;
      }

      .confirm-overlay.is-dark .confirm-box {
        border-color: rgba(255, 255, 255, 0.14);
        background: rgba(24, 34, 52, 0.95);
        backdrop-filter: blur(14px);
      }

      .confirm-title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: #162032;
      }

      .confirm-overlay.is-dark .confirm-title {
        color: #f8fafc;
      }

      .confirm-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 18px;
      }

      .confirm-button {
        min-width: 88px;
        height: 36px;
        border: 0;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.16s ease,
          opacity 0.16s ease,
          background-color 0.16s ease;
      }

      .confirm-button:hover {
        transform: translateY(-1px);
      }

      .confirm-button:active {
        transform: translateY(0);
        opacity: 0.88;
      }

      .confirm-cancel-button {
        background: rgba(24, 35, 50, 0.08);
        color: #334155;
      }

      .confirm-overlay.is-dark .confirm-cancel-button {
        background: rgba(255, 255, 255, 0.12);
        color: #e2e8f0;
      }

      .confirm-ok-button {
        background: #e24a4a;
        color: #fff;
        box-shadow: 0 8px 18px rgba(226, 74, 74, 0.28);
      }
    </style>
  </head>
  <body data-mode="loading" data-surface="light">
    <section class="agreement-card">
      <button class="sa-close-button" id="close-button" type="button" aria-label="关闭" title="关闭">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path
            d="M3 3L11 11M11 3L3 11"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <h1 class="agreement-title" id="agreement-title">用户协议与隐私提示</h1>
      <p class="agreement-subtitle">
        首次使用 PisaMusic 前，请先确认以下协议内容。<span id="agreement-version"></span>
      </p>
      <div class="agreement-content">
        <span id="agreement-content">欢迎使用 PisaMusic。当前暂未获取到最新协议内容，请稍后重试。</span>
      </div>
      <div class="actions">
        <button class="action-button reject-button" id="reject-button">拒绝</button>
        <button class="action-button agree-button" id="agree-button">同意</button>
      </div>
    </section>

    <main class="loading-viewport">
      <div class="startup-stage-host" id="loading-stage-host" data-surface="light"></div>
    </main>

    <div
      class="confirm-overlay"
      id="quit-confirm-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="quit-confirm-title"
    >
      <div class="confirm-box">
        <p class="confirm-title" id="quit-confirm-title">确认停止启动App？</p>
        <div class="confirm-actions">
          <button class="confirm-button confirm-cancel-button" id="quit-cancel-button" type="button">
            取消
          </button>
          <button class="confirm-button confirm-ok-button" id="quit-confirm-button" type="button">
            确认
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./startup-window.ts"></script>
  </body>
</html>
