<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PisaMusic 启动</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: #182332;
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
        user-select: none;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }

      .startup-card {
        position: relative;
        overflow: hidden;
        width: calc(100vw - 48px);
        height: calc(100vh - 48px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.82);
        border-radius: 28px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(250, 254, 255, 0.92)),
          radial-gradient(circle at 18% 18%, rgba(55, 174, 124, 0.15), transparent 34%),
          radial-gradient(circle at 86% 20%, rgba(40, 151, 255, 0.16), transparent 30%);
        box-shadow: 0 8px 10px rgba(24, 35, 50, 0.12);
        -webkit-app-region: drag;
      }

      .close-button {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 2;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(24, 35, 50, 0.48);
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition:
          background-color 0.16s ease,
          color 0.16s ease,
          transform 0.16s ease;
      }

      .close-button:hover {
        background: rgba(24, 35, 50, 0.08);
        color: #162032;
      }

      .close-button:active {
        transform: scale(0.94);
      }

      .confirm-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(246, 250, 252, 0.78);
        backdrop-filter: blur(8px);
        -webkit-app-region: no-drag;
      }

      .confirm-overlay.is-open {
        display: flex;
      }

      .confirm-box {
        width: 100%;
        max-width: 310px;
        padding: 22px 24px 20px;
        border: 1px solid rgba(24, 35, 50, 0.08);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 14px 30px rgba(24, 35, 50, 0.14);
        text-align: center;
      }

      .confirm-title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: #162032;
      }

      .confirm-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 18px;
      }

      .confirm-button {
        min-width: 88px;
        height: 36px;
        border: 0;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.16s ease,
          opacity 0.16s ease,
          background-color 0.16s ease;
      }

      .confirm-button:hover {
        transform: translateY(-1px);
      }

      .confirm-button:active {
        transform: translateY(0);
        opacity: 0.88;
      }

      .confirm-cancel-button {
        background: rgba(24, 35, 50, 0.08);
        color: #334155;
      }

      .confirm-ok-button {
        background: #e24a4a;
        color: #fff;
        box-shadow: 0 8px 18px rgba(226, 74, 74, 0.24);
      }

      .panel {
        display: none;
        height: 100%;
      }

      body[data-mode="agreement"] .agreement-panel,
      body[data-mode="loading"] .loading-panel {
        display: flex;
      }

      .agreement-panel {
        flex-direction: column;
        padding: 38px 42px 34px;
      }

      .agreement-title {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0;
        color: #162032;
      }

      .agreement-subtitle {
        margin: 8px 0 22px;
        color: rgba(24, 35, 50, 0.62);
        font-size: 14px;
      }

      .agreement-content {
        flex: 1;
        padding: 18px 20px;
        border: 1px solid rgba(31, 41, 55, 0.08);
        border-radius: 18px;
        background: rgba(246, 250, 252, 0.92);
        color: rgba(24, 35, 50, 0.78);
        font-size: 14px;
        line-height: 1.85;
        overflow: auto;
        white-space: pre-wrap;
        user-select: text;
        -webkit-app-region: no-drag;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 14px;
        margin-top: 24px;
        -webkit-app-region: no-drag;
      }

      .action-button {
        min-width: 104px;
        height: 42px;
        border: 0;
        border-radius: 999px;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          opacity 0.18s ease;
      }

      .action-button:hover {
        transform: translateY(-1px);
      }

      .action-button:active {
        transform: translateY(0);
        opacity: 0.88;
      }

      .reject-button {
        background: #e24a4a;
        box-shadow: 0 12px 24px rgba(226, 74, 74, 0.24);
      }

      .agree-button {
        background: #20b46b;
        box-shadow: 0 12px 24px rgba(32, 180, 107, 0.24);
      }

      .loading-panel {
        align-items: center;
        justify-content: center;
        padding: 34px;
      }

      .loading-inner {
        display: grid;
        grid-template-columns: 82px auto;
        align-items: center;
        gap: 20px;
      }

      .logo-shell {
        width: 82px;
        height: 82px;
        padding: 8px;
        border-radius: 24px;
        background: #fff;
        box-shadow:
          inset 0 0 0 1px rgba(24, 35, 50, 0.08),
          0 16px 38px rgba(40, 151, 255, 0.18);
      }

      #logo {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 18px;
        object-fit: cover;
      }

      .brand-title {
        margin: 0;
        color: #64748b;
        font-family: Georgia, "Times New Roman", "STSong", "Songti SC", serif;
        font-size: 28px;
        font-style: italic;
        font-weight: 500;
        letter-spacing: 0.25em;
        line-height: 1;
      }

      .loading-text {
        grid-column: 1 / -1;
        justify-self: center;
        margin-top: 26px;
        color: rgba(24, 35, 50, 0.56);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .loading-text span {
        display: inline-block;
        animation: shimmer 1.5s ease-in-out infinite;
      }

      .loading-text span:nth-child(1) {
        animation-delay: 0s;
      }

      .loading-text span:nth-child(2) {
        animation-delay: 0.12s;
      }

      .loading-text span:nth-child(3) {
        animation-delay: 0.24s;
      }

      .loading-text span:nth-child(4) {
        animation-delay: 0.36s;
      }

      .loading-text span:nth-child(5) {
        animation-delay: 0.48s;
      }

      .loading-text span:nth-child(6) {
        animation-delay: 0.6s;
      }

      .loading-text span:nth-child(7) {
        animation-delay: 0.72s;
      }

      @keyframes shimmer {
        0%,
        100% {
          opacity: 0.28;
          transform: translateY(0);
        }

        45% {
          opacity: 1;
          transform: translateY(-1px);
        }
      }
    </style>
  </head>
  <body data-mode="loading">
    <main class="startup-card">
      <button class="close-button" id="close-button" type="button" aria-label="关闭" title="关闭">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path
            d="M3 3L11 11M11 3L3 11"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>

      <section class="panel agreement-panel">
        <h1 class="agreement-title" id="agreement-title">用户协议与隐私提示</h1>
        <p class="agreement-subtitle">首次使用 PisaMusic 前，请先确认以下协议内容。<span id="agreement-version"></span></p>
        <div class="agreement-content">
          <span id="agreement-content">欢迎使用 PisaMusic。当前暂未获取到最新协议内容，请稍后重试。</span>
        </div>
        <div class="actions">
          <button class="action-button reject-button" id="reject-button">拒绝</button>
          <button class="action-button agree-button" id="agree-button">同意</button>
        </div>
      </section>

      <section class="panel loading-panel">
        <div class="loading-inner">
          <div class="logo-shell">
            <img id="logo" alt="PisaMusic" />
          </div>
          <h1 class="brand-title">Pisa Music</h1>
          <div class="loading-text" aria-label="正在启动">
            <span>正</span><span>在</span><span>启</span><span>动</span><span>.</span><span>.</span><span>.</span>
          </div>
        </div>
      </section>

      <div class="confirm-overlay" id="quit-confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="quit-confirm-title">
        <div class="confirm-box">
          <p class="confirm-title" id="quit-confirm-title">确认停止启动App？</p>
          <div class="confirm-actions">
            <button class="confirm-button confirm-cancel-button" id="quit-cancel-button" type="button">取消</button>
            <button class="confirm-button confirm-ok-button" id="quit-confirm-button" type="button">确认</button>
          </div>
        </div>
      </div>
    </main>

    <script>
      const { ipcRenderer } = require("electron");

      const logo = document.getElementById("logo");
      const agreementTitle = document.getElementById("agreement-title");
      const agreementContent = document.getElementById("agreement-content");
      const agreementVersion = document.getElementById("agreement-version");
      const agreeButton = document.getElementById("agree-button");
      const rejectButton = document.getElementById("reject-button");
      const closeButton = document.getElementById("close-button");
      const quitConfirmOverlay = document.getElementById("quit-confirm-overlay");
      const quitCancelButton = document.getElementById("quit-cancel-button");
      const quitConfirmButton = document.getElementById("quit-confirm-button");

      function setQuitConfirmOpen(open) {
        quitConfirmOverlay.classList.toggle("is-open", open);
      }

      function applySnapshot(snapshot) {
        if (!snapshot) return;
        document.body.dataset.mode = snapshot.mode || "loading";
        if (snapshot.logoUrl) {
          logo.src = snapshot.logoUrl;
        }
        if (snapshot.agreementTitle) {
          agreementTitle.textContent = snapshot.agreementTitle;
        }
        if (snapshot.agreementContent) {
          agreementContent.textContent = snapshot.agreementContent;
        }
        agreementVersion.textContent = snapshot.agreementVersion
          ? `（版本 ${snapshot.agreementVersion}）`
          : "";
      }

      ipcRenderer.on("startup:snapshot", (_event, snapshot) => {
        applySnapshot(snapshot);
      });

      agreeButton.addEventListener("click", () => {
        ipcRenderer.invoke("startup:agree").catch(() => {});
      });

      rejectButton.addEventListener("click", () => {
        ipcRenderer.invoke("startup:reject").catch(() => {});
      });

      closeButton.addEventListener("click", () => {
        setQuitConfirmOpen(true);
      });

      quitCancelButton.addEventListener("click", () => {
        setQuitConfirmOpen(false);
      });

      quitConfirmButton.addEventListener("click", () => {
        quitConfirmButton.disabled = true;
        ipcRenderer.invoke("startup:quit").catch(() => {
          quitConfirmButton.disabled = false;
        });
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && quitConfirmOverlay.classList.contains("is-open")) {
          setQuitConfirmOpen(false);
        }
      });

      window.addEventListener("DOMContentLoaded", () => {
        ipcRenderer.send("startup:splash-ready");
      });
    </script>
  </body>
</html>
