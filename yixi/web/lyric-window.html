<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PisaMusic 桌面歌词</title>
    <link rel="stylesheet" href="./lyric-window.css" />
  </head>
  <body>
    <main id="lyric-window">
      <div id="interaction-surface">
        <canvas id="lyric-canvas" aria-hidden="true"></canvas>
        <p id="lyric-live" class="sr-only" aria-live="polite">暂无歌词</p>
        <nav id="controller" aria-label="桌面歌词控制">
          <button class="btn" id="size-down" title="减小字号" aria-label="减小字号"><span>A-</span></button>
          <button class="btn" id="size-up" title="增大字号" aria-label="增大字号"><span>A+</span></button>
          <button class="btn" id="prev-btn" title="上一首" aria-label="上一首">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M3 3.75a.75.75 0 0 1 1.5 0v16.5a.75.75 0 0 1-1.5 0zm18 1.003c0-1.408-1.578-2.24-2.74-1.444L7.763 10.503a1.75 1.75 0 0 0-.01 2.88l10.499 7.302c1.16.807 2.749-.024 2.749-1.437z"/></svg>
          </button>
          <button class="btn" id="play-btn" title="播放" aria-label="播放">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M21.409 9.353a2.998 2.998 0 0 1 0 5.294L8.597 21.614C6.534 22.737 4 21.277 4 18.968V5.033c0-2.31 2.534-3.769 4.597-2.648z"/></svg>
          </button>
          <button class="btn" id="pause-btn" title="暂停" aria-label="暂停" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M2 6c0-1.886 0-2.828.586-3.414S4.114 2 6 2s2.828 0 3.414.586S10 4.114 10 6v12c0 1.886 0 2.828-.586 3.414S7.886 22 6 22s-2.828 0-3.414-.586S2 19.886 2 18zm12 0c0-1.886 0-2.828.586-3.414S16.114 2 18 2s2.828 0 3.414.586S22 4.114 22 6v12c0 1.886 0 2.828-.586 3.414S19.886 22 18 22s-2.828 0-3.414-.586S14 19.886 14 18z"/></svg>
          </button>
          <button class="btn" id="next-btn" title="下一首" aria-label="下一首">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M3 4.753c0-1.408 1.578-2.24 2.74-1.444l10.498 7.194a1.75 1.75 0 0 1 .01 2.88L5.749 20.685C4.59 21.492 3 20.66 3 19.248zM21 3.75a.75.75 0 0 0-1.5 0v16.5a.75.75 0 0 0 1.5 0z"/></svg>
          </button>
          <button class="btn" id="lock-btn" title="锁定" aria-label="锁定">
            <svg id="lock-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2M9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9zm9 14H6V10h12zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2s-2 .9-2 2s.9 2 2 2"/></svg>
            <svg id="unlock-icon" style="display: none;" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="10" x="5" y="11" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg>
          </button>
          <button class="btn" id="close-btn" title="关闭" aria-label="关闭">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="m7 7l10 10M7 17L17 7"/></svg>
          </button>
        </nav>
        <div id="resize-zones" aria-hidden="true">
          <div class="resize-zone resize-t" data-direction="t"></div>
          <div class="resize-zone resize-r" data-direction="r"></div>
          <div class="resize-zone resize-b" data-direction="b"></div>
          <div class="resize-zone resize-l" data-direction="l"></div>
          <div class="resize-zone resize-tl" data-direction="tl"></div>
          <div class="resize-zone resize-tr" data-direction="tr"></div>
          <div class="resize-zone resize-br" data-direction="br"></div>
          <div class="resize-zone resize-bl" data-direction="bl"></div>
        </div>
      </div>
    </main>
    <script type="module" src="./lyric-window.ts"></script>
  </body>
</html>
